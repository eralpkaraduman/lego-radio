# Lefthook configuration for lego-radio
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
      fail_text: "Run 'cargo fmt' to fix formatting"

    clippy:
      glob: "*.rs"
      run: cargo clippy --all-targets -- -D warnings -A clippy::manual_range_contains
      fail_text: "Fix clippy warnings before committing"

    test:
      glob: "*.rs"
      run: cargo test --quiet
      fail_text: "Tests failed"

pre-push:
  parallel: true
  commands:
    test-all:
      run: cargo test
      fail_text: "Tests must pass before pushing"
