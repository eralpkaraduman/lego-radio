name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Generate audio files for compilation (tests need include_bytes!)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate TTS audio
        uses: docker/build-push-action@v6
        with:
          context: .
          target: audio-gen
          load: true
          tags: lego-radio-audio:latest
          cache-from: type=gha,scope=audio-gen
          cache-to: type=gha,mode=min,scope=audio-gen

      - name: Extract audio files
        run: |
          docker run --rm -v ${{ github.workspace }}/audio:/output lego-radio-audio:latest cp -r /audio/. /output/
          ls -la audio/

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings -A clippy::manual_range_contains -A clippy::empty_line_after_doc_comments -A clippy::manual_is_multiple_of

      - name: Run tests
        run: cargo test --verbose

  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check
        run: |
          CURRENT_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Current version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Not a push to main, skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git ls-remote --tags origin | grep -q "refs/tags/v$CURRENT_VERSION$"; then
            echo "Tag v$CURRENT_VERSION already exists, skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected, will release v$CURRENT_VERSION"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: [test, check-version]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build arm64 binary via Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: TARGET=arm64
          outputs: type=local,dest=out
          cache-from: |
            type=gha,scope=audio-gen
            type=gha,scope=build-arm64
          cache-to: type=gha,mode=min,scope=build-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lego-radio-arm64
          path: out/lego-radio-arm64

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    if: needs.check-version.outputs.should_release == 'true'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: lego-radio-arm64

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ needs.check-version.outputs.version }}
          git push origin v${{ needs.check-version.outputs.version }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          files: lego-radio-arm64
          generate_release_notes: true
